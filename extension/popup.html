<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-border Toolkit</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="side-title" data-i18n="app.title">跨境工具</div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <select id="lang" aria-label="Language">
          <option value="auto" data-i18n="lang.auto">自动</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button id="open-tab" class="icon-btn" data-i18n-title="app.openTab" title="在新标签页打开">↗</button>
      </div>
    </aside>
    <main class="content"><div class="panel" id="panel"></div></main>
  </div>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
